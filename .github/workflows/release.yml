# Rocktier Journal — build & release
# macOS aarch64 dmg + app.zip; Windows x64 MSI/NSIS + MSIX/MSIXBundle (Store).
# 触发：tag 推送（v*）。main 分支推送只留 artifact，不创建 release。
name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build DMG
        run: npm run tauri build

      - name: Package app.zip
        run: |
          set -e
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Journal_aarch64.app.zip"

      - name: Upload artifact (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_aarch64.app.zip
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_aarch64.app.zip
          generate_release_notes: true

  build-windows:
    name: Windows x64 (MSI + MSIX)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build MSI + NSIS installers
        run: npm run tauri build

      # MSIX/MSIXBundle for Microsoft Store：tauri-windows-bundle 写盘到
      # src-tauri/target/msix/，不是 gen/windows/（那只是输入模板）。
      #
      # ROCKTIER_CHANNEL=store 关掉本应用自带的试用与激活：商店版由微软收款、
      # 授权也由商店判定，带着自研付费墙会触发微软政策 10.8.2（第三方购买 API
      # 须申报与逐笔认证）与 10.8.4（须披露试用范围与价格区间）→ 拒审/重审风险。
      # Journal 存的是最私密的内容，误上付费墙的代价比其他产品更高。
      # 上一步的 MSI + NSIS 不设该变量，保持默认 direct 渠道（官网直链）。
      - name: Build MSIX (Microsoft Store)
        env:
          ROCKTIER_CHANNEL: store
        run: npm run tauri:windows:build

      - name: Upload artifacts (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            # 保留 || true 仅为让轮询能继续重试（资产 API 确实会 lag），
            # 但**必须把 stderr 打出来** —— 之前 `2>/dev/null` 把它一并丢掉，
            # 于是 gh 的真实错误（权限 / 仓库名 / Rate limit）被伪装成
            # 「资产还没上传」，报错信息完全指错方向，排查方向整个跑偏。
            # 实测踩过：MD v1.0.7 / CAD v0.2.5 / Journal v0.2.7 三个仓资产其实齐全，
            # 校验却报「六个包全缺」—— 就是这一行。修复沿用 Write 仓的写法。
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
