# Rocktier Journal — build & release
# macOS aarch64 dmg + app.zip; Windows x64 MSI/NSIS + MSIX/MSIXBundle (Store).
# 触发：tag 推送（v*）。main 分支推送只留 artifact，不创建 release。
name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build DMG
        run: npm run tauri build

      - name: Package app.zip
        run: |
          set -e
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Journal_aarch64.app.zip"

      - name: Upload artifact (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_aarch64.app.zip
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_aarch64.app.zip
          generate_release_notes: true

  build-windows:
    name: Windows x64 (MSI + MSIX)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build MSI + NSIS installers
        run: npm run tauri build

      # MSIX/MSIXBundle for Microsoft Store：tauri-windows-bundle 写盘到
      # src-tauri/target/msix/，不是 gen/windows/（那只是输入模板）。
      - name: Build MSIX (Microsoft Store)
        run: npm run tauri:windows:build

      - name: Upload artifacts (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true
