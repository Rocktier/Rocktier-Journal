name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x86_64 MSI
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build MSI
        uses: tauri-apps/tauri-action@v0.5
        id: tauri_action
        with:
          args: "--bundles msi --target x86_64-pc-windows-msvc"
          projectPath: "."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 去掉 MSI 文件名里的 _en-US（Tauri v2 会按 bundle.windows.wix.language 追加）。
      # 应用本身带语言切换器，文件名宣称单一语言会误导 —— 看起来像存在
      # 「英文版」和其他本地化安装包，而实际只有一个多语言安装包。
      # 只改文件名，不动 bundle 配置：WiX 的 language 字段是 MSI 构建必需的
      # 工具链语言码，改它会让构建失败。
      - name: Strip _en-US from MSI filename
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in src-tauri/target/release/bundle/msi/*_en-US.msi \
                   src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-windows-x86_64-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
