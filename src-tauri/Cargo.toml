[package]
name = "rocktier-journal"
version = "0.2.7"
description = "Rocktier Journal — a private diary. Encrypted. Offline. Yours alone."
authors = ["Rocktier"]
edition = "2021"

[lib]
name = "rocktier_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
zip = "0.6"
zeroize = "1"
# L6 家族授权（license.rs）：Ed25519 离线验签 + 回执 base64 编解码
ed25519-dalek = "2"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
